spring.application.name=meal-tracker-api
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}

jwt.expiration-minutes=1440
jwt.secret=${JWT_SECRET}

google.oauth.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.callback-url=${GOOGLE_CALLBACK_URL}

ml.service.base-url=${ML_SERVICE_BASE_URL}
openai.api.base-url=${OPENAI_API_BASE_URL}
openai.api.key=${OPENAI_API_KEY}
openai.api.model=${OPENAI_API_MODEL}
usda.api.base-url=${USDA_API_BASE_URL}
usda.api.key=${USDA_API_KEY}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000