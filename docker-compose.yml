services:
  postgres:
    image: postgres:16-alpine
    container_name: mealtracker-postgres
    environment:
      POSTGRES_DB: mealtracker
      POSTGRES_USER: mealtracker_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealtracker_user -d mealtracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: mealtracker-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: