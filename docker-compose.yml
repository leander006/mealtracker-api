# Standalone compose for this repo. Runs the backend alone against your
# Neon main DB and whatever ML_SERVICE_URL you point it at (localhost:8000
# if you're also running ml-service locally, or your Render ml-service URL).
#
# Usage: cp .env.example .env, fill it in, then: docker compose up --build

services:
  backend:
    build: .
    ports:
      - "8080:8080"
      - "5005:5005"
    env_file:
      - .env
